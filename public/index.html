<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenFlow Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    .status { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
    .card { background: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #3a3a3a; }
    .card h3 { font-size: 0.9em; color: #999; margin-bottom: 10px; }
    .card .value { font-size: 2em; font-weight: bold; color: #4CAF50; }
    .section { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .section h2 { margin-bottom: 15px; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
    button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #45a049; }
    input { background: #1a1a1a; color: #fff; border: 1px solid #3a3a3a; padding: 8px; border-radius: 4px; margin: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>💎 TokenFlow Dashboard</h1>
      <p>Intelligent AI Research & Work Management Tool</p>
    </header>

    <div class="status" id="status"></div>

    <div class="section">
      <h2>📊 Budget Status</h2>
      <div id="budget"></div>
    </div>

    <div class="section">
      <h2>📁 Projects</h2>
      <div id="projects"></div>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      const status = await fetch('/api/status').then(r => r.json());
      const budget = await fetch('/api/budget').then(r => r.json());
      
      // Status cards
      document.getElementById('status').innerHTML = `
        <div class="card">
          <h3>Projects</h3>
          <div class="value">${status.projects.length}</div>
        </div>
        <div class="card">
          <h3>Work Items</h3>
          <div class="value">${status.works.length}</div>
        </div>
        <div class="card">
          <h3>Total Budget</h3>
          <div class="value">$${budget.budget}</div>
        </div>
        <div class="card">
          <h3>Remaining</h3>
          <div class="value">$${budget.remaining.toFixed(2)}</div>
        </div>
      `;
      
      // Budget details
      document.getElementById('budget').innerHTML = `
        <p>Spent: <strong>$${budget.spent.toFixed(4)}</strong></p>
        <p>Budget: <strong>$${budget.budget}</strong></p>
        <p>Remaining: <strong>$${budget.remaining.toFixed(4)}</strong></p>
      `;
      
      // Projects
      document.getElementById('projects').innerHTML = `
        <p>Total Projects: ${status.projects.length}</p>
        ${status.projects.map(p => `<p>📌 ${p.name} (${p.type})</p>`).join('')}
      `;
    }
    
    loadDashboard();
  </script>
</body>
</html>
